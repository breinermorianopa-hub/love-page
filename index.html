<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la persona que inspira mis días ❤️</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <h1>Para Ti ❤️</h1>

    <img src="img/image.png" alt="Nuestra foto" class="foto">

    <!-- 💌 SOBRE -->
    <div id="sobre" class="sobre" onclick="mostrarSorpresa()">
        <div class="sobre-tapa"></div>
        <div class="sobre-cuerpo"></div>
    </div>

    <p style="color:white; font-size:20px; text-align:center;">
        Toca el sobre o el botón para descubrir una sorpresa ❤️
    </p>

    <button onclick="mostrarSorpresa()">
        🌹 Abrir mi carta 🌹
    </button>

    <!-- 💌 CARTA -->
    <div id="carta" class="carta oculta">

        <h2>💌 Una carta para ti 💌</h2>

        <div id="textoCarta"></div>

    </div>

    <!-- ❤️ PANEL QUE APARECE DESPUÉS DE LA CARTA -->
    <div id="panelPoemas" class="botones-poesia oculta">

        <button onclick="mostrarPoema('ojos')">
            👀 Tus ojos
        </button>

        <button onclick="mostrarPoema('sonrisa')">
            😊 Tu sonrisa
        </button>

        <button onclick="mostrarPoema('carita')">
            🥰 Tu carita
        </button>

        <button onclick="mostrarPoema('voz')">
            🎶 Tu voz
        </button>

        <button onclick="mostrarPoema('personalidad')">
            ❤️ Tu personalidad
        </button>

        <button onclick="cartaSecreta()">
            💌 Carta Secreta
        </button>

        <button onclick="mostrarRazon()">
            ✨ Una razón más
        </button>

    </div>

    <!-- 💌 POEMAS -->
    <div id="poema" class="carta oculta">

        <h2>💌 Para ti 💌</h2>

        <div id="textoPoema"></div>

    </div>

    <!-- ✨ RAZONES -->
    <div id="razon" class="carta oculta">

        <h2>✨ Otra razón por la que me gustas ✨</h2>

        <div id="textoRazon"></div>

    </div>

    <!-- 🌹 MENSAJE FINAL -->
    <div id="final" class="carta oculta">

        <h2>🌹 Un último mensaje 🌹</h2>

        <div id="textoFinal"></div>

    </div>

    <!-- 🧸 OSITO -->
    <div id="oso">🧸</div>

    <!-- 🌌 CONSTELACIÓN -->
    <div id="constelacion">

        <span>C</span>
        <span>R</span>
        <span>I</span>
        <span>S</span>
        <span>T</span>
        <span>I</span>
        <span>N</span>
        <span>A</span>

    </div>

    <!-- 🎵 AUDIO -->
    <audio id="musica" loop>
        <source src="audio/musica.mp3" type="audio/mpeg">
    </audio>

    <script src="js/script.js"></script>

</body>
</html>
